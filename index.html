<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 시험지 생성기</title>
<script>
  // 저장된 화면 모드를 먼저 적용해 깜빡임 방지
  try { var t = localStorage.getItem('wordTest.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="style.css?v=20261119n">
</head>
<body>
<div class="layout">
  <!-- 왼쪽: 교재 + 설정 -->
  <div class="left">
    <header class="top">
      <h1>영어 단어 시험지 생성기</h1>
      <nav class="tabs">
        <button type="button" data-view="gen" class="active">시험지 만들기</button>
        <button type="button" data-view="prog">진도표</button>
      </nav>
      <span class="spacer"></span>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="화면 모드 바꾸기">🌙 다크 모드</button>
    </header>

    <!-- 진도표 화면 -->
    <div class="prog" id="progView" hidden>
      <div class="sheet-status" id="sheetBox">
        <span class="tiny status" id="sheetStatus"></span>
        <label class="admin-key">관리 키 <input type="password" id="adminKey" autocomplete="off" spellcheck="false" placeholder="학생 추가·수정·삭제용"></label>
        <button type="button" class="btn small" id="adminKeySave">저장</button>
      </div>

      <div class="pmode-bar">
        <div class="seg">
          <label><input type="radio" name="pmode" value="list" checked><span>목록</span></label>
          <label><input type="radio" name="pmode" value="sheet"><span>시트</span></label>
        </div>
        <a class="btn small" id="sheetOpen" target="_blank" rel="noopener" hidden>새 창에서 열기 ↗</a>
        <span class="tiny" id="pmodeNote"></span>
      </div>

      <div class="sheet-frame-box" id="sheetFrameBox" hidden>
        <p class="empty" id="sheetFrameMsg" hidden></p>
        <iframe id="sheetFrame" title="구글 시트 진도표" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <div class="prog-grid" id="progGrid">
        <div class="block prog-opts">
          <div class="block-head">
            <h2>인쇄 설정</h2>
            <button type="button" class="btn small shuffle-btn" id="progShuffle">🔀 다시 섞기</button>
          </div>
          <div class="opt-row"><span>기본 Day 수</span>
            <select id="progDefault" title="학생별로 따로 고르지 않았을 때 한 번에 볼 Day 수">
              <option value="1">1개</option>
              <option value="2" selected>2개</option>
              <option value="3">3개</option>
              <option value="4">4개</option>
              <option value="5">5개</option>
            </select>
          </div>
          <div class="opt-col"><span>문항</span>
            <div class="seg seg-full">
              <label><input type="radio" name="progType" value="meaning" checked><span>뜻</span></label>
              <label><input type="radio" name="progType" value="spelling"><span>스펠링</span></label>
              <label><input type="radio" name="progType" value="half"><span>반반</span></label>
            </div>
          </div>
          <div class="opt-col"><span>배치</span>
            <div class="seg seg-full">
              <label><input type="radio" name="progMode" value="random" checked><span>섞기</span></label>
              <label><input type="radio" name="progMode" value="byday"><span>Day별로</span></label>
            </div>
          </div>
          <div class="opt-col"><span>답지</span>
            <div class="seg seg-full">
              <label><input type="radio" name="progAns" value="each" checked><span>학생마다</span></label>
              <label><input type="radio" name="progAns" value="end"><span>맨 뒤에</span></label>
            </div>
          </div>
          <label class="field">날짜<input type="date" id="progDate"></label>
          <label class="switch duplex"><input type="checkbox" id="progDuplex" checked><span class="knob"></span><span>양면 인쇄 <small class="tiny">답지·다음 학생은 새 장에서</small></span></label>
        </div>

        <div class="block prog-list">
          <div class="block-head">
            <h2>학생 <span class="accent" id="progCount"></span></h2>
            <div class="head-btns">
              <button type="button" class="btn small admin-only" id="stuAdd" hidden>＋ 학생 추가</button>
              <button type="button" class="btn small" id="printSheet" title="지금 보이는 학년의 진도표를 A4 가로로 인쇄">🖨 진도표</button>
              <button type="button" class="btn small" id="progRefresh">↻ 새로고침</button>
              <button type="button" class="btn small" id="progNone">선택 해제</button>
            </div>
          </div>
          <div class="grade-chips chips" id="gradeChips"></div>
          <div id="progTable"></div>
        </div>
      </div>
    </div>

    <section class="books">
      <div id="bookList" class="book-list"><p class="muted">교재 목록을 불러오는 중…</p></div>
    </section>

    <div class="work" id="work" hidden>
      <div class="block col-day">
        <div class="block-head">
          <h2>Day 선택 <span class="accent" id="dayCountText"></span></h2>
          <div class="head-btns">
            <button type="button" class="btn small" id="selectAll">전체</button>
            <button type="button" class="btn small" id="selectNone">해제</button>
          </div>
        </div>
        <div id="dayGrid" class="day-grid" title="Shift+클릭: 범위 선택"></div>
      </div>

      <div class="block col-count">
        <div class="block-head">
          <h2>문항 수</h2>
          <span class="tiny">선택 단어 <b class="accent" id="totalWords">0</b>개 · 출제 <b id="sumCount">0</b>문항</span>
        </div>
        <div class="count-row">
          <span class="type-name"><span class="dot d1"></span>뜻 쓰기</span>
          <div class="stepper" data-target="meaningCount">
            <button type="button" class="mini" data-act="dec" aria-label="하나 줄이기">−</button>
            <input type="number" id="meaningCount" min="0" value="0" inputmode="numeric">
            <button type="button" class="mini" data-act="inc" aria-label="하나 늘리기">+</button>
            <button type="button" class="mini wide" data-act="max">최대</button>
          </div>
        </div>
        <div class="count-row">
          <span class="type-name"><span class="dot d2"></span>스펠링 쓰기</span>
          <div class="stepper" data-target="spellingCount">
            <button type="button" class="mini" data-act="dec" aria-label="하나 줄이기">−</button>
            <input type="number" id="spellingCount" min="0" value="0" inputmode="numeric">
            <button type="button" class="mini" data-act="inc" aria-label="하나 늘리기">+</button>
            <button type="button" class="mini wide" data-act="max">최대</button>
          </div>
        </div>
        <p class="warn" id="countWarn" hidden></p>
        <div class="chips">
          <button type="button" class="chip" data-quick="meaning">전부 뜻</button>
          <button type="button" class="chip" data-quick="spelling">전부 스펠링</button>
          <button type="button" class="chip" data-quick="half">반반</button>
        </div>
      </div>

      <div class="block col-opts">
        <div class="block-head">
          <h2>배치 · 시험지</h2>
          <button type="button" class="btn small shuffle-btn" id="shuffleBtn2">🔀 다시 섞기</button>
        </div>
        <div class="seg seg-full">
          <label><input type="radio" name="mode" value="random" checked><span>Day 구분 없이 무작위</span></label>
          <label><input type="radio" name="mode" value="byday"><span>Day별로 무작위</span></label>
        </div>
        <div class="opt-row"><span>첫 글자 힌트</span>
          <label class="switch"><input type="checkbox" id="hint"><span class="knob"></span><span class="tiny">스펠링 문제</span></label>
        </div>
        <div class="opt-row"><span>양면 인쇄</span>
          <label class="switch"><input type="checkbox" id="genDuplex" checked><span class="knob"></span><span class="tiny">답지는 새 장에서</span></label>
        </div>
        <div class="field-row">
          <label class="field grow"><span class="field-label">시험 제목 <button type="button" class="link-btn" id="titleReset" hidden>↺ 자동</button></span><input type="text" id="title"></label>
          <label class="field date">날짜<input type="date" id="date"></label>
        </div>
      </div>
    </div>
  </div>

  <!-- 오른쪽: 미리보기 -->
  <main class="preview">
    <div class="toolbar">
      <button type="button" class="btn shuffle-btn" id="shuffleBtn">🔀 다시 섞기</button>
      <span class="spacer"></span>
      <button type="button" class="btn primary" data-print="both">시험지+답지 인쇄</button>
      <button type="button" class="btn" data-print="test">시험지만</button>
      <button type="button" class="btn" data-print="answer">답지만</button>
    </div>
    <div class="preview-scroll">
      <p class="empty" id="emptyMsg">교재를 고르면 여기에 시험지 미리보기가 나타납니다.</p>
      <div class="preview-area" id="previewArea">
        <div class="sizer" id="sizer">
          <div class="scaler" id="scaler">
            <div id="testPages" class="pages"></div>
            <div id="answerPages" class="pages"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<dialog id="stuDlg" class="stu-dlg">
  <form method="dialog" id="stuForm">
    <h2 id="stuDlgTitle">학생 추가</h2>
    <div class="field-row">
      <label class="field" style="width:90px">학년
        <input type="text" id="stuGrade" list="gradeOptions" placeholder="예: 중3" autocomplete="off">
      </label>
      <label class="field grow">교재
        <select id="stuBook"></select>
      </label>
    </div>
    <label class="field">이름<input type="text" id="stuName" autocomplete="off"></label>
    <label class="field">비고<input type="text" id="stuNote" autocomplete="off"></label>
    <p class="warn" id="stuErr" hidden></p>
    <div class="dlg-btns">
      <button type="button" class="btn danger" id="stuDelete" hidden>삭제</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="stuCancel">취소</button>
      <button type="submit" class="btn primary" id="stuSave">저장</button>
    </div>
  </form>
</dialog>
<datalist id="gradeOptions">
  <option value="중1"><option value="중2"><option value="중3"><option value="고1"><option value="고2"><option value="고3">
</datalist>

<script src="app.js?v=20261119n"></script>
<div id="sheetPrint" class="sheet-print"></div>
</body>
</html>
