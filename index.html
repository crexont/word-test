<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 시험지 생성기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>영어 단어 시험지 생성기</h1>
  <p class="sub">교재 → Day → 문항 수만 고르면 오른쪽에 바로 시험지가 만들어집니다.</p>
</header>

<section class="books">
  <div id="bookList" class="book-list"><p class="muted">교재 목록을 불러오는 중…</p></div>
</section>

<div class="work" id="work" hidden>
  <aside class="panel">
    <div class="block">
      <div class="block-head">
        <h2>Day 선택 <span class="accent" id="dayCountText"></span></h2>
        <div class="head-btns">
          <button type="button" class="btn small" id="selectAll">전체</button>
          <button type="button" class="btn small" id="selectNone">해제</button>
        </div>
      </div>
      <p class="tiny">Shift+클릭으로 범위를 한 번에 선택할 수 있습니다.</p>
      <div id="dayGrid" class="day-grid"></div>
    </div>

    <div class="block">
      <div class="block-head">
        <h2>문항 수</h2>
        <span class="tiny">선택한 단어 <b class="accent" id="totalWords">0</b>개 · 출제 <b id="sumCount">0</b>문항</span>
      </div>
      <div class="count-row">
        <span class="type-name"><span class="dot d1"></span>뜻 쓰기</span>
        <div class="stepper" data-target="meaningCount">
          <button type="button" class="mini" data-act="dec" aria-label="하나 줄이기">−</button>
          <input type="number" id="meaningCount" min="0" value="10" inputmode="numeric">
          <button type="button" class="mini" data-act="inc" aria-label="하나 늘리기">+</button>
          <button type="button" class="mini wide" data-act="max">최대</button>
        </div>
      </div>
      <div class="count-row">
        <span class="type-name"><span class="dot d2"></span>스펠링 쓰기</span>
        <div class="stepper" data-target="spellingCount">
          <button type="button" class="mini" data-act="dec" aria-label="하나 줄이기">−</button>
          <input type="number" id="spellingCount" min="0" value="10" inputmode="numeric">
          <button type="button" class="mini" data-act="inc" aria-label="하나 늘리기">+</button>
          <button type="button" class="mini wide" data-act="max">최대</button>
        </div>
      </div>
      <p class="warn" id="countWarn" hidden></p>
      <div class="chips">
        <button type="button" class="chip" data-quick="meaning">전부 뜻</button>
        <button type="button" class="chip" data-quick="spelling">전부 스펠링</button>
        <button type="button" class="chip" data-quick="half">반반</button>
      </div>
      <p class="tiny">같은 단어는 뜻·스펠링 중 한 유형에만 나옵니다.</p>
    </div>

    <div class="block">
      <h2>배치</h2>
      <div class="opt-row"><span>문항 순서</span>
        <div class="seg">
          <label><input type="radio" name="mode" value="split" checked><span>유형별로</span></label>
          <label><input type="radio" name="mode" value="mix"><span>섞기</span></label>
        </div>
      </div>
      <div class="opt-row"><span>글자 크기</span>
        <select id="fontSize">
          <option value="12">아주 작게</option>
          <option value="13">작게</option>
          <option value="14" selected>보통</option>
          <option value="16">크게</option>
          <option value="18">아주 크게</option>
        </select>
      </div>
      <div class="opt-row"><span>첫 글자 힌트</span>
        <label class="switch"><input type="checkbox" id="hint"><span class="knob"></span><span class="tiny">스펠링 문제</span></label>
      </div>
    </div>

    <div class="block">
      <h2>시험지 정보</h2>
      <label class="field">학원명<input type="text" id="academy" placeholder="예: ○○ 영어학원"></label>
      <label class="field">시험 제목<input type="text" id="title" placeholder="비우면 자동으로 만들어집니다"></label>
      <label class="field">날짜<input type="date" id="date"></label>
    </div>
  </aside>

  <main class="preview">
    <div class="toolbar">
      <button type="button" class="btn" id="shuffleBtn">⟳ 다시 섞기</button>
      <span class="spacer"></span>
      <button type="button" class="btn primary" data-print="both">시험지+답지 인쇄</button>
      <button type="button" class="btn" data-print="test">시험지만</button>
      <button type="button" class="btn" data-print="answer">답지만</button>
    </div>
    <p class="empty" id="emptyMsg" hidden></p>
    <div class="preview-area" id="previewArea">
      <div class="sizer" id="sizer">
        <div class="scaler" id="scaler">
          <div id="testPages" class="pages"></div>
          <div id="answerPages" class="pages"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
